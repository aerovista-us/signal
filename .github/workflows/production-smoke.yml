name: Production smoke gate

on:
  push:
    branches: [main]
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production origin to verify
        required: false
        default: https://thesignal.aerovista.us/

permissions:
  contents: read

concurrency:
  group: signal-production-smoke
  cancel-in-progress: true

jobs:
  smoke-production:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Production' ||
        github.event.deployment.environment == 'github-pages'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify production matches governed catalog
        env:
          SIGNAL_BASE_URL: ${{ inputs.base_url || 'https://thesignal.aerovista.us/' }}
        run: python scripts/smoke_production.py --base-url "$SIGNAL_BASE_URL"
