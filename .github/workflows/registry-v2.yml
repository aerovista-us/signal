name: Registry v2 validation

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "scripts/registry_v2.py"
      - "scripts/test_registry_v2.py"
      - "scripts/smoke_production.py"
      - "scripts/test_smoke_production.py"
      - ".github/workflows/production-smoke.yml"
      - "js/signals-catalog.json"
      - "newsletters/**"
      - "dispatches/**"
      - "publications/**"

permissions:
  contents: read

jobs:
  validate-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Registry v2 regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate and regenerate Registry v2
        run: python scripts/registry_v2.py check
      - name: Fail if generated views are stale
        run: git diff --exit-code -- registry/indexes js/signals-catalog.json
