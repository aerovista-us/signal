name: Registry v2 validation

on:
  pull_request:
    paths:
      - "registry/**"
      - "scripts/registry_v2.py"
      - "newsletters/**"
      - "dispatches/**"
      - "publications/**"
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "scripts/registry_v2.py"
      - "newsletters/**"
      - "dispatches/**"
      - "publications/**"

permissions:
  contents: read

jobs:
  validate-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Signal Registry v2
        run: python scripts/registry_v2.py check
      - name: Fail if generated indexes are stale
        run: git diff --exit-code -- registry/indexes
