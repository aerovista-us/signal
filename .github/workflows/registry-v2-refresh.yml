name: Registry v2 branch refresh

on:
  push:
    branches: [registry-v2]
    paths:
      - "registry/**"
      - "scripts/registry_v2.py"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: registry-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh manifests, SHA-256 hashes, indexes, and UI catalog
        run: python scripts/registry_v2.py refresh
      - name: Commit generated registry state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/records registry/indexes js/signals-catalog.json
          if git diff --cached --quiet; then
            echo "Registry already fresh."
          else
            git commit -m "Registry v2: refresh manifests and generated views"
            git push origin HEAD:registry-v2
          fi
